<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClass</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="images/Fibonacci sequence_.jpg">
</head>

<body>

    <header class="topbar">
    <a href="index.html" class="logo">OpenClass</a>

    <input
        type="search"
        class="search"
        placeholder="Search courses..."
    >

    <div class="header-right">^w^</div>
</header>

    <main class="content">

        <div class="section-heading">
            <h1>Subjects</h1>
        </div>

        <section class="subject-grid">

           <a href="physics.html" class="subject-card">
                 <img
                    class="subject-thumbnail"
                    src="images/physics.jpg"
                    alt="Physics"
                 >
                <h2>Physics</h2>
            </a>

            <a href="chemistry.html" class="subject-card">
                 <img
                    class="subject-thumbnail"
                    src="images/chem.jpg"
                    alt="Chemistry"
                 >
             <h2>Chemistry</h2>
            </a>

            <a href="#" class="subject-card">
                 <img
                    class="subject-thumbnail"
                    src="images/bio.jpg"
                    alt="Biology"
                    >
                <h2>Biology</h2>

            </a>

            <a href="#" class="subject-card">
                 <img
                    class="subject-thumbnail"
                    src="images/hm.jpg"
                    alt="Higher Math"
                    >
                <h2>Higher Mathematics</h2>
            </a>

        </section>

    </main>

</body>
</html>
