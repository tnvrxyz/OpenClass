<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - OpenClass</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            height: 68px;
            padding: 0 5%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #272727;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        main {
            width: 90%;
            max-width: 650px;
            margin: 55px auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .profile {
            background: #181818;
            border: 1px solid #303030;
            border-radius: 12px;
            padding: 28px;
        }

        .avatar-area {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 28px;
        }

        #avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #303030;
            object-fit: cover;
            border: 1px solid #444;
        }

        .avatar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button, .upload-label {
            background: #303030;
            color: white;
            border: 1px solid #454545;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover, .upload-label:hover {
            background: #414141;
        }

        .remove-button, .logout-button {
            color: #ff7777;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 9px;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            background: #0f0f0f;
            border: 1px solid #383838;
            border-radius: 7px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #777;
        }

        .email {
            color: #aaa;
            font-size: 15px;
        }

        .save-button {
            background: #fff;
            color: #111;
            border: none;
            font-weight: 600;
            margin-top: 5px;
        }

        .save-button:hover {
            background: #ddd;
        }

        .save-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .logout-button {
            margin-top: 28px;
        }

        #status {
            color: #aaa;
            font-size: 14px;
            margin-top: 18px;
            min-height: 18px;
        }

        #file-input {
            display: none;
        }

        @media (max-width: 500px) {
            main {
                margin-top: 35px;
            }

            .profile {
                padding: 20px;
            }

            .avatar-area {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">OpenClass</a>
</header>

<main>
    <h1>My Account</h1>

    <section class="profile">

        <div class="avatar-area">
            <img id="avatar" src="" alt="Profile picture" style="visibility:hidden;">

            <div class="avatar-actions">
                <label for="file-input" class="upload-label">
                    Change picture
                </label>

                <input type="file" id="file-input" accept="image/*">

                <button type="button" class="remove-button" id="remove-avatar">
                    Remove
                </button>
            </div>
        </div>

        <div class="field">
            <label for="display-name">Display name</label>
            <input
                type="text"
                id="display-name"
                placeholder="Enter your name"
                maxlength="40"
            >
        </div>

        <div class="field">
            <label>Email address</label>
            <p class="email" id="email">Loading...</p>
        </div>

        <button type="button" class="save-button" id="save-name">
            Save changes
        </button>

        <p id="status"></p>

    </section>

    <button type="button" class="logout-button" id="logout">
        Log out
    </button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
(() => {
    const client = window.supabaseClient;

    const avatar = document.getElementById("avatar");
    const fileInput = document.getElementById("file-input");
    const displayName = document.getElementById("display-name");
    const emailElement = document.getElementById("email");
    const status = document.getElementById("status");
    const saveButton = document.getElementById("save-name");

    let currentUser = null;

    function showStatus(message) {
        status.textContent = message;
    }

    function showAvatar(url) {
        if (url) {
            avatar.src = url;
            avatar.style.visibility = "visible";
        } else {
            avatar.removeAttribute("src");
            avatar.style.visibility = "hidden";
        }
    }

    async function loadProfile() {
        try {
            if (!client) {
                showStatus("Supabase connection not found. Check js/supabase.js.");
                return;
            }

            const { data, error } = await client.auth.getUser();

            if (error || !data.user) {
                window.location.href = "login.html";
                return;
            }

            currentUser = data.user;

            emailElement.textContent = currentUser.email || "";
            displayName.value =
                currentUser.user_metadata?.display_name || "";

            showAvatar(currentUser.user_metadata?.avatar_url || "");
            showStatus("");

        } catch (error) {
            showStatus("Could not load account: " + error.message);
            console.error(error);
        }
    }

    // SAVE DISPLAY NAME AND RETURN HOME
    saveButton.addEventListener("click", async () => {
        if (!currentUser) return;

        const name = displayName.value.trim();

        if (!name) {
            showStatus("Please enter a display name.");
            return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        showStatus("Saving your profile...");

        try {
            const { error } = await client.auth.updateUser({
                data: { display_name: name }
            });

            if (error) throw error;

            showStatus("Profile saved! Returning to OpenClass...");
            saveButton.textContent = "Saved!";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);

        } catch (error) {
            showStatus("Error: " + error.message);
            saveButton.disabled = false;
            saveButton.textContent = "Save changes";
        }
    });

    // PROFILE PICTURE UPLOAD
    fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];

        if (!file || !currentUser) return;

        if (!file.type.startsWith("image/")) {
            showStatus("Please select an image.");
            return;
        }

        if (file.size > 8 * 1024 * 1024) {
            showStatus("Image must be smaller than 8 MB.");
            return;
        }

        const previewURL = URL.createObjectURL(file);
        showAvatar(previewURL);
        showStatus("Preparing image...");

        try {
            const image = new Image();

            await new Promise((resolve, reject) => {
                image.onload = resolve;
                image.onerror = reject;
                image.src = previewURL;
            });

            const canvas = document.createElement("canvas");

            const scale = Math.min(
                1,
                512 / Math.max(image.width, image.height)
            );

            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);

            canvas.getContext("2d").drawImage(
                image, 0, 0, canvas.width, canvas.height
            );

            const blob = await new Promise(resolve => {
                canvas.toBlob(resolve, "image/jpeg", 0.85);
            });

            if (!blob) throw new Error("Could not process image.");

            showStatus("Uploading picture...");

            const path = `${currentUser.id}/avatar.jpg`;

            const { error: uploadError } = await client
                .storage
                .from("avatars")
                .upload(path, blob, {
                    contentType: "image/jpeg",
                    upsert: true
                });

            if (uploadError) throw uploadError;

            const { data } = client
                .storage
                .from("avatars")
                .getPublicUrl(path);

            const publicURL = data.publicUrl + "?t=" + Date.now();

            const { error: updateError } = await client.auth.updateUser({
                data: { avatar_url: publicURL }
            });

            if (updateError) throw updateError;

            showAvatar(publicURL);
            showStatus("Profile picture updated! You can now save your changes.");

        } catch (error) {
            showStatus("Upload failed: " + error.message);
            console.error("Avatar upload error:", error);

        } finally {
            URL.revokeObjectURL(previewURL);
        }
    });

    // REMOVE PROFILE PICTURE
    document.getElementById("remove-avatar").addEventListener("click", async () => {
        if (!currentUser) return;

        showStatus("Removing picture...");

        try {
            const path = `${currentUser.id}/avatar.jpg`;

            const { error: removeError } = await client
                .storage
                .from("avatars")
                .remove([path]);

            if (removeError) throw removeError;

            const { error: updateError } = await client.auth.updateUser({
                data: { avatar_url: null }
            });

            if (updateError) throw updateError;

            showAvatar("");
            fileInput.value = "";

            showStatus("Profile picture removed!");

        } catch (error) {
            showStatus("Could not remove picture: " + error.message);
            console.error(error);
        }
    });

    // LOG OUT
    document.getElementById("logout").addEventListener("click", async () => {
        try {
            const { error } = await client.auth.signOut();

            if (error) throw error;

            window.location.href = "login.html";

        } catch (error) {
            showStatus("Logout failed: " + error.message);
        }
    });

    loadProfile();
})();
</script>

</body>
</html>
