<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | OpenClass</title>
<link rel="icon" type="image/jpeg" href="images/favicon.jpg">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0f0f0f;
    color: #fff;
    font-family: Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 22px 5%;
    border-bottom: 1px solid #272727;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 25px;
    font-weight: bold;
}

main {
    width: 90%;
    max-width: 420px;
    margin: 80px auto;
}

h1 {
    font-size: 29px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 32px;
    font-size: 14px;
}
  label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 22px;
    background: #181818;
    border: 1px solid #383838;
    border-radius: 7px;
    color: white;
    font-size: 15px;
}

input:focus {
    outline: 1px solid #aaa;
}

button {
    width: 100%;
    padding: 14px;
    background: white;
    color: black;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.6;
    color: #aaa;
}

.login {
    margin-top: 25px;
    color: #aaa;
    font-size: 14px;
    text-align: center;
}

a {
    color: white;
}

footer {
    margin-top: auto;
    padding: 25px;
    text-align: center;
    color: #666;
    font-size: 12px;
}
</style>
</head>
  <body>

<header>
    <a href="index.html" class="logo">OpenClass</a>
</header>

<main>
    <h1>Create your account</h1>
    <p class="subtitle">
        join Openclass :3.
    </p>

    <form id="signup-form">

        <label for="email">Email address</label>
        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            minlength="8"
            required
        >

        <label for="confirm-password">Confirm password</label>
        <input
            type="password"
            id="confirm-password"
            placeholder="Enter your password again"
            minlength="8"
            required
        >

        <button type="submit" id="signup-button">
            Create account
        </button>

    </form>

    <p id="message"></p>

    <p class="login">
        Already have an account?
        <a href="login.html">Log in</a>
    </p>
</main>

<footer>
    OpenClass · 2026
</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
const form = document.getElementById("signup-form");
const message = document.getElementById("message");
const button = document.getElementById("signup-button");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirm-password").value;

    message.textContent = "";

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {
        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo:
                    "https://tnvrxyz.github.io/OpenClass/login.html"
                }
            });

        if (error) throw error;

        message.textContent =
            "Account created! Check your email and click the confirmation link.";

        form.reset();

    } catch (error) {
        message.textContent = error.message;
    }

    button.disabled = false;
    button.textContent = "Create account";
});
</script>

</body>
</html>
